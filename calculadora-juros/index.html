<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Juros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <section class="calculator p-4 p-md-5 rounded-4 shadow">
      <div class="d-flex align-items-center mb-4">
        <div class="icon-box me-3">%</div>
        <div>
          <h1 class="h3 fw-bold mb-1">Calculadora de Juros</h1>
          <p class="text-secondary mb-0">Simule o rendimento do seu dinheiro</p>
        </div>
      </div>

      <div class="mb-4 text-start">
        <label for="TipoInvestimento" class="form-label">Tipo de investimento</label>
        <select class="form-select form-select-lg" id="TipoInvestimento">
          <option value="nominal">Poupança (0,5% ao mês)</option>
          <option value="cdi">CDB / Tesouro Direto (100% do CDI)</option>
          <option value="cdb">LCI / LCA (taxa anual)</option>
        </select>
      </div>

      <div class="row row-cols-1 row-cols-sm-2 g-3 mb-4">
        <div class="col text-start">
          <label for="Aporte" class="form-label">Quanto vai investir? (R$)</label>
          <div class="input-group">
            <span class="input-group-text">R$</span>
            <input type="text" class="form-control form-control-lg" id="Aporte" placeholder="500,00">
          </div>
        </div>
        <div class="col text-start">
          <label for="Tempo" class="form-label">Tempo de aplicação</label>
          <div class="input-group">
            <input type="number" class="form-control form-control-lg" id="Tempo" placeholder="6" min="1" max="60">
            <span class="input-group-text">meses</span>
          </div>
        </div>
      </div>

      <div class="mb-4 text-start">
        <label for="Juros" id="labelJuros" class="form-label">Taxa de juros (% ao mês)</label>
        <input type="text" class="form-control form-control-lg" id="Juros" placeholder="Ex: 0,50">
        <div id="helpJuros" class="form-text">Informe a taxa mensal de rendimento.</div>
      </div>

      <input type="hidden" id="Montante">
      <div class="d-flex gap-2 mt-4">
        <button type="button" onclick="simular()" class="btn btn-dark btn-lg flex-grow-1">Calcular rendimento</button>
        <button type="button" onclick="limparCampos()" class="btn btn-outline-secondary btn-lg" title="Limpar campos">Limpar</button>
      </div>
      <div id="resultado" class="alert alert-success mt-4 d-none" role="status"></div>

      <div class="table-responsive mt-5 text-start">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-3">
          <h2 class="h5 fw-bold mb-0">Histórico de simulações</h2>
          <button type="button" onclick="limparHistorico()" class="btn btn-sm btn-outline-danger">Limpar histórico</button>
        </div>
        <div class="border rounded-3 overflow-hidden">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Data / Hora</th><th>Aporte</th><th>Taxa / Tipo</th><th>Tempo</th><th>Total</th>
              </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
